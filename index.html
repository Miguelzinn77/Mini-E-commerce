<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title> E-commerce </title> 
</head>
<body>
    

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Mini Ecommerce</span>
    <span class="text-white-50">FakeStore + ViaCEP</span>
  </div>
</nav>

<main class="container">

  <section class="mb-4">
    <h1 class="fw-bold">Produtos em destaque</h1>
    <p class="text-muted">
      Clique em um produto para ver os detalhes e simular uma compra.
    </p>
  </section>

  <section>
    <div id="listaProdutos" class="row g-4"></div>
  </section>

  <section id="areaDetalhe" class="card shadow mt-5 mb-5 d-none">
    <div class="card-body p-4">
      <div class="row g-4 align-items-center">

        <div class="col-md-5 text-center">
          <img id="detalheImagem" class="img-fluid produto-detalhe-img" src="" alt="">
        </div>

        <div class="col-md-7">
          <p id="detalheCategoria" class="categoria"></p>

          <h2 id="detalheTitulo" class="fw-bold"></h2>

          <p id="detalheDescricao" class="text-muted"></p>

          <p id="detalhePreco" class="preco"></p>

          <button class="btn btn-success btn-lg" onclick="abrirCompra()">
            Comprar agora
          </button>

          <div id="areaCompra" class="mt-4 d-none">
            <div class="border rounded p-3 bg-light">
              <h5>Calcular endereço de entrega</h5>

              <div class="row g-2">
                <div class="col-md-8">
                  <input
                    type="text"
                    id="inputCep"
                    class="form-control"
                    placeholder="Digite seu CEP"
                    maxlength="9"
                  >
                </div>

                <div class="col-md-4">
                  <button class="btn btn-dark w-100" onclick="buscarCep()">
                    Buscar CEP
                  </button>
                </div>
              </div>

              <div id="resultadoCep" class="alert mt-3 d-none">
                <h6 id="cepTitulo"></h6>
                <p id="cepRua" class="mb-1"></p>
                <p id="cepBairro" class="mb-1"></p>
                <p id="cepCidade" class="mb-1"></p>
                <p id="cepEstado" class="mb-0"></p>
              </div>
            </div>
          </div>

        </div>

      </div>
    </div>
  </section>

</main>



<script src="index.js"></script>
</body>
</html>
